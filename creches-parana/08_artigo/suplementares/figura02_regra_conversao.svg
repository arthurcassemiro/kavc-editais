   <g id="text_1">
    <text style="font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(20.571274 32.491062)">Entradas por município: população total de 2022 (define o porte), população-alvo, PCM e creches</text>
    <text style="font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(111.65643 40.601828)">já atribuídas na etapa prévia (43 unidades)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(100.929281 64.399302)">Classificação em oito portes e definição de</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(153.169281 73.033286)">cotas por bloco</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(29.673467 98.966679)">Portes G2 a P4: 30 municípios, 100</text>
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(77.601982 107.769438)">creches</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(203.671815 98.966679)">Portes P3, P2 e P1: 369 municípios, 157</text>
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(259.940565 107.769438)">creches</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(19.891475 130.168982)">1. Cota populacional: J = parcela do município</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(24.944053 137.66739)">na população-alvo do porte × cota do porte</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(206.028651 130.168982)">1. Exclusão: municípios já contemplados na</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(218.863807 137.723718)">etapa prévia não entram no ranking</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(26.131865 160.654883)">2. Correção pelo PCM: K = J × (1 + PCM),</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(28.937334 168.265948)">descontadas as creches da etapa prévia</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(196.10287 160.457)">2. Ordenação pelo PCM dentro do porte: P3 usa a</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(196.894198 168.028689)">variante (1·FE + FD + 3·FS)/5/100; P2 e P1 usam</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(251.55162 175.581785)">o PCM padrão</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(17.262646 191.212425)">3. Arredondamento: parte inteira de K; unidades</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(26.038896 198.792865)">restantes às maiores frações (maior resto)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(205.638182 198.41241)">3. Cotas por porte: P3, 27 de 62 municípios;</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(196.48787 205.927771)">P2, 100 de 205; P1, 30 de 102 (uma creche cada)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(17.144521 221.795671)">4. Tetos por município: G2 10, G1 8, M2 7, M1 4</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(19.986631 229.628766)">e P4 2; excedente redistribuído até fechar 100</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(196.500448 228.954639)">4. Resultado: 157 municípios com uma creche; os</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(227.234823 236.46836)">demais ficam fora nesta etapa</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(31.245883 261.001977)">Distribuição consolidada: 43 (etapa prévia) + 100 (portes grandes) + 157 (ranking nos</text>
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(91.147446 269.112744)">portes pequenos) = 300 creches em 224 municípios</text>
   </g>
  </g>
 </g>
