   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #3a3a3a" x="63.892913" y="15.102669" transform="rotate(-0 63.892913 15.102669)">Figura 1. Arranjo institucional e financeiro do Programa Infância Feliz Paraná</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="117.715748" y="32.111438" transform="rotate(-0 117.715748 32.111438)">Critério</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="239.640945" y="32.085803" transform="rotate(-0 239.640945 32.085803)">Deliberação e regulação</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="361.566142" y="32.09115" transform="rotate(-0 361.566142 32.09115)">Financiamento e execução</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(101.962467 57.538558)">Casa Civil</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(73.364732 64.442513)">Estudo técnico: PCM, portes</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(86.78067 71.940921)">e regra de alocação</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(205.407117 49.293665)">CEDCA/PR (conselho</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(225.831804 56.887776)">paritário)</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(198.006257 64.386185)">Aporte do FIA e aprovação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(201.704226 71.940921)">do estudo (Deliberações</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(209.283914 79.51261)">60/2023 e 25/2024)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(318.829501 53.347752)">Fontes: Tesouro do Estado,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(328.498251 61.315926)">FIA/PR e Assembleia</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(318.57411 68.233553)">Legislativa (R$ 100 milhões</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(346.781376 75.735242)">em 2024)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(106.042701 113.965744)">Ipardes</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(73.941686 121.561496)">Estudo prévio (43 unidades)</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(90.085436 129.767014)">e bases de dados</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(195.878914 110.188376)">SEDEF (gestora do FIA/PR)</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(195.082664 117.7278)">Resoluções 212 e 219/2024:</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(219.998836 125.617224)">critério, lista,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(206.565945 132.837272)">habilitação e repasse</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(326.353954 110.880173)">Paranacidade / SECID</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(324.600126 117.784128)">Projeto padrão, análise,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(323.438017 125.282536)">autorização para licitar e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(348.730439 133.544382)">vistorias</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(88.938054 163.047507)">Incentivo financeiro fundo a fundo (FIA/PR para os fundos municipais), por Termo de Adesão, em</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(109.100789 170.627947)">cinco parcelas condicionadas à execução; sem convênio e sem operação de crédito</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(90.03782 197.951188)">Municípios (399): adesão, terreno, projeto de implantação, licitação, obra e prestação de contas;</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(148.205086 205.521237)">custo excedente e custeio posterior por conta do município</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(72.359478 230.305481)">Controle: TCE-PR, MP-PR, CEDCA e conselhos</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(130.839556 237.581858)">municipais</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(262.84163 230.068137)">Resultado: 303 unidades em 261 municípios</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(282.098193 237.581858)">(2024); segunda etapa em 2025</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #5f5f5f" x="7.2" y="286.748545" transform="rotate(-0 7.2 286.748545)">Fonte: Elaboração própria a partir da Lei Estadual 21.870/2023, das Deliberações CEDCA 60/2023 e 25/2024 e das Resoluções SEDEF 212 e 219/2024 e 029/2025.</text>
  </g>
 </g>
