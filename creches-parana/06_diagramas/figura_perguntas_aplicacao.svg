   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #3a3a3a" x="63.892913" y="14.901018" transform="rotate(-0 63.892913 14.901018)">Figura 5. Perguntas da aplicação: do PCM às unidades</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="129.798425" y="25.235993" transform="rotate(-0 129.798425 25.235993)">Pergunta</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="312.137008" y="25.241339" transform="rotate(-0 312.137008 25.241339)">Decisão</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(115.402488 38.068599)">1. Escala</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(77.283113 44.931538)">Como comparar a capital com um</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(82.524363 52.52729)">município de 3 mil habitantes?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(241.708258 41.15417)">Oito portes populacionais; cota de cada porte</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(265.247945 48.734609)">proporcional à população-alvo</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(108.982722 70.171286)">2. Conversão</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(71.054753 77.792741)">Como transformar um índice contínuo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(95.558035 85.306462)">em unidades inteiras?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(232.774508 73.323576)">Cota do município × (1 + PCM); parte inteira; maior</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(304.356617 81.255656)">resto</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(104.117722 101.592568)">3. Concentração</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(74.162644 109.229335)">Como evitar que poucos municípios</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(95.944675 116.743056)">recebam quase tudo?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(222.061773 105.451967)">Tetos por município nos portes grandes; uma unidade aos</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(249.10857 113.006704)">municípios de maior PCM nos pequenos</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(110.795613 133.746662)">4. Validação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(76.11116 141.357726)">Quem aprova o critério e como ele</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(115.016394 149.563244)">vira lista?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(222.271773 137.565046)">Deliberação do CEDCA; Resolução SEDEF com critério e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(230.621461 145.135094)">lista; o próximo ranqueado substitui quem não adere</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(114.821706 167.175672)">5. Limites</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(88.743425 174.079627)">O que o índice não capta?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(230.239742 166.483875)">Terreno, capacidade de licitar e fila local; margem de</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(258.049977 174.730408)">decisão delimitada e documentada</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #5f5f5f" x="7.2" y="215.655631" transform="rotate(-0 7.2 215.655631)">Fonte: Elaboração própria.</text>
  </g>
 </g>
