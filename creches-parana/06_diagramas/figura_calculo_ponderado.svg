   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #3a3a3a" x="63.892913" y="14.988302" transform="rotate(-0 63.892913 14.988302)">Figura 3. Aplicação do PCM: da cota populacional às unidades inteiras</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(103.176195 32.278376)">Parâmetros: 257 unidades a distribuir, oito portes, população-alvo por porte, PCM por</text>
    <text style="font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(187.017382 40.095087)">município, tetos e cotas por faixa</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(123.373919 62.939781)">1. Cota do porte</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(78.627513 70.520221)">proporcional à população-alvo, corrigida pelo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(119.102825 78.09027)">PCM médio (eq. 6)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(298.710861 62.980797)">2. Cota do município</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(264.076174 70.520221)">parcela do município na população-alvo do</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(311.746721 78.049254)">porte (eq. 7)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #ffffff" x="239.640945" y="102.42964" transform="rotate(-0 239.640945 102.42964)">3. Ajuste pelo indicador: K = cota × (1 + PCM) − unidades da etapa prévia (eq. 8)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="148.471654" y="129.452733" transform="rotate(-0 148.471654 129.452733)">4. Parte inteira de K (eq. 9)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(259.808908 126.408177)">5. Maior resto: unidades restantes às maiores</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(306.300392 133.214789)">frações (eq. 10)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(82.134075 157.465857)">6a. Portes grandes: teto por município (10,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(131.74056 164.981218)">8, 7, 4 e 2)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(269.715549 157.424841)">6b. Portes pequenos: uma unidade aos</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(267.980314 165.020593)">municípios de maior PCM (27, 100 e 30)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(96.091507 189.354466)">Resultado: 43 + 100 + 157 = 300 unidades; a lista publicada (303 em 261 municípios)</text>
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(177.635445 197.077802)">reduziu os tetos dos portes grandes</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #5f5f5f" x="7.2" y="241.847757" transform="rotate(-0 7.2 241.847757)">Fonte: Elaboração própria a partir das planilhas de cálculo (abas Metodologia e Dados) e da Resolução SEDEF 219/2024.</text>
  </g>
 </g>
