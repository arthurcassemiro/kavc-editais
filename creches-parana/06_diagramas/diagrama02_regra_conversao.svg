   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #3a3a3a" x="63.892913" y="14.911124" transform="rotate(-0 63.892913 14.911124)">Figura 2. Regra de conversão do PCM em creches na distribuição consolidada (300 unidades)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(77.264187 32.491062)">Entradas por município: população total de 2022 (define o porte), população-alvo, PCM e creches</text>
    <text style="font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(168.349343 40.601828)">já atribuídas na etapa prévia (43 unidades)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(157.622195 64.399302)">Classificação em oito portes e definição de</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(209.862195 73.033286)">cotas por bloco</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(86.36638 98.966679)">Portes G2 a P4: 30 municípios, 100</text>
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(134.294896 107.769438)">creches</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(260.364728 98.966679)">Portes P3, P2 e P1: 369 municípios, 157</text>
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(316.633478 107.769438)">creches</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(76.584388 130.168982)">1. Cota populacional: J = parcela do município</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(81.636966 137.66739)">na população-alvo do porte × cota do porte</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(262.721564 130.168982)">1. Exclusão: municípios já contemplados na</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(275.556721 137.723718)">etapa prévia não entram no ranking</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(82.824779 160.654883)">2. Correção pelo PCM: K = J × (1 + PCM),</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(85.630247 168.265948)">descontadas as creches da etapa prévia</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(252.795783 160.457)">2. Ordenação pelo PCM dentro do porte: P3 usa a</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(253.587111 168.028689)">variante (1·FE + FD + 3·FS)/5/100; P2 e P1 usam</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(308.244533 175.581785)">o PCM padrão</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(73.95556 191.212425)">3. Arredondamento: parte inteira de K; unidades</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(82.73181 198.792865)">restantes às maiores frações (maior resto)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(262.331096 198.41241)">3. Cotas por porte: P3, 27 de 62 municípios;</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(253.180783 205.927771)">P2, 100 de 205; P1, 30 de 102 (uma creche cada)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(73.837435 221.795671)">4. Tetos por município: G2 10, G1 8, M2 7, M1 4</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(76.679544 229.628766)">e P4 2; excedente redistribuído até fechar 100</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(253.193361 228.954639)">4. Resultado: 157 municípios com uma creche; os</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(283.927736 236.46836)">demais ficam fora nesta etapa</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(87.938796 261.001977)">Distribuição consolidada: 43 (etapa prévia) + 100 (portes grandes) + 157 (ranking nos</text>
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(147.840359 269.112744)">portes pequenos) = 300 creches em 224 municípios</text>
   </g>
  </g>
  <g id="text_15">
