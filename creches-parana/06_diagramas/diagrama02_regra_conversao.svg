   <g id="text_1">
    <text style="font-weight: 500; font-size: 10px; font-family: 'IBM Plex Sans'; text-anchor: start; fill: #3a3a3a" x="72.865701" y="22.333795" transform="rotate(-0 72.865701 22.333795)">Figura 2. Regra de conversão do PCM em creches na distribuição consolidada (300 unidades)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(105.26575 38.830903)">Entradas por município: população total 2022 (define o porte), população-alvo 0–4 anos, PCM, creches já</text>
    <text style="font-size: 7.2px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(209.901437 47.856216)">atribuídas na etapa prévia (43 unidades)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(199.611625 70.262389)">Classificação em oito portes (G2, G1, M2, M1,</text>
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(250.126937 79.507076)">P4, P3, P2, P1)</text>
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(225.441625 88.211764)">e definição de cotas por bloco</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 600; font-size: 7.8px; font-family: 'IBM Plex Sans'; text-anchor: middle; fill: #3a3a3a" x="171.723969" y="107.297575" transform="rotate(-0 171.723969 107.297575)">Portes G2 a P4 (30 municípios, 100 creches)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 7.8px; font-family: 'IBM Plex Sans'; text-anchor: middle; fill: #3a3a3a" x="378.227906" y="107.297575" transform="rotate(-0 378.227906 107.297575)">Portes P3, P2 e P1 (369 municípios, 157 creches)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(141.393875 122.351031)">1. Cota populacional</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(99.23225 130.729938)">J = (pop. 0–4 do município / pop. 0–4 do porte) ×</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(97.106328 138.893828)">ponderação do porte (parcela da população-alvo ×</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(150.300781 147.167031)">total ajustado)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(139.925375 167.68334)">2. Correção pelo PCM</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(107.73439 176.08545)">K = J × (1 + PCM) − creches da etapa prévia</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(142.862375 201.307352)">3. Arredondamento</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(98.025172 209.065961)">parte inteira de K; unidades restantes distribuídas</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(124.051344 217.292758)">às maiores frações (maior resto)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(145.509078 237.653864)">4. Tetos por porte</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(100.605359 246.042567)">G2: 10 · G1: 8 · M2: 7 · M1: 4 · P4: 2 creches por</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(97.992687 254.421473)">município; excedente redistribuído até fechar 100</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(361.364906 127.096328)">1. Exclusão</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(307.056702 134.854938)">municípios já contemplados na etapa prévia não</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(351.247827 142.936328)">entram no ranking</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(343.653702 163.55834)">2. Ordenação pelo PCM</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(299.937984 172.05945)">P3 usa a variante (1·FE + FD + 3·FS)/5; P2 e P1 usam</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(357.695718 180.081543)">o PCM padrão</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(351.673218 200.588055)">3. Cotas por porte</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(300.053999 209.065961)">P3: 27 de 62 municípios · P2: 100 de 205 · P1: 30 de</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(344.112609 217.460852)">102 (uma creche cada)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(359.651999 238.412864)">4. Resultado</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(297.768234 246.171473)">157 municípios com uma creche; os demais ficam fora</text>
    <text style="font-size: 6.6px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(360.849796 254.025473)">nesta etapa</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(121.333 282.274782)">Distribuição consolidada: 43 (etapa prévia) + 100 (portes grandes) + 157 (ranking nos portes</text>
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(200.686 291.318094)">pequenos) = 300 creches em 224 municípios</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-size: 6.3px; font-family: 'IBM Plex Sans'; text-anchor: start; fill: #8a8a8a" x="7.2" y="378.9" transform="rotate(-0 7.2 378.9)">Fonte: Elaboração própria a partir das abas Metodologia, Dados e Resultados da planilha 20240327_Distribuicao_Creches. O passo 4 do bloco grande reproduz 28 dos 30 valores observados; a regra do bloco pequeno reproduz os 157 casos.</text>
  </g>
 </g>
