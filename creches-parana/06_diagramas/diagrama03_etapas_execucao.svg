   <g id="text_1">
    <text style="font-weight: 500; font-size: 10px; font-family: 'IBM Plex Sans'; text-anchor: start; fill: #3a3a3a" x="72.865701" y="23.837055" transform="rotate(-0 72.865701 23.837055)">Figura 3. Da distribuição técnica à execução: etapas, decisões e marcos</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(242.250937 42.056637)">Base de dados e PCM</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(103.933625 50.84245)">Nove indicadores (Censo 2022, Censo Escolar 2023, Datasus, CadÚnico, IPDM); três fatores; PCM = (2·FE + FD +</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(224.062 58.550356)">2·FS)/5/100 para 399 municípios</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(235.139093 78.631961)">Distribuição técnica inicial</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(109.930906 87.155868)">Oito portes (P1 até 20 mil hab.); fórmula L = [J·(1+PCM) + 3·(PCM + K)]/4 e maior resto; 251 creches em 209</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(203.849 95.655868)">municípios; piso quase uniforme por município</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(197.887843 117.970692)">Distribuição consolidada (planilha de 27/03/2024)</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(115.271031 126.518505)">Etapa prévia de 43 unidades (índice de prioridade do Ipardes) + 100 para os 30 municípios grandes (cota</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(100.817312 134.953692)">populacional × (1+PCM), tetos) + 157 por ranking do PCM em P3, P2 e P1 (portes reclassificados); 300 creches em</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(251.431468 143.559411)">224 municípios</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(118.819781 164.898251)">Lista publicada (Deliberação CEDCA 25/2024, de 24/05; Resolução SEDEF 219/2024, de 04/06/2024)</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(96.554031 173.446064)">Anexo I com 303 creches em 261 municípios: 17 municípios grandes cedem 37 unidades; 37 municípios entram com</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(110.798437 181.946064)">uma unidade, todos logo abaixo da linha de corte do ranking em seu porte; nenhum município selecionado é</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #ffffff" transform="translate(262.909125 190.993251)">retirado</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(228.71575 211.82581)">Habilitação (jun/2024 a 2025)</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(102.856781 220.414529)">Adesão no sistema fundo a fundo até 19/06/2024; terreno de 1.200 m², projeto padrão de 456,86 m², conselho e</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(102.301093 228.82581)">fundo municipais ativos; 11 vagas remanescentes reofertadas em 24/06/2024; prazos prorrogados três vezes em</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(178.750093 237.373623)">2024; segunda etapa em 2025 (108 unidades, 100 municípios)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(226.550375 257.116361)">Licitação e obras (2025 a 2026)</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(107.996093 265.708268)">Teto por unidade de R$ 1,30 milhão (2024) a R$ 1,99 milhão (2025); Paranacidade analisa projetos e autoriza</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(105.045 274.031361)">licitação; 52 licitações autorizadas em ago/2025, 107 em out/2025; 48 obras em fev/2026 e 110 obras em 106</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(236.818375 282.70508)">municípios em mai/2026</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(261.515125 302.493967)">Entregas</text>
    <text style="font-size: 6.8px; font-family: 'IBM Plex Sans'; fill: #3a3a3a" transform="translate(100.644656 311.477405)">Nenhuma unidade concluída localizada em fonte oficial até set/2026; obra mais adiantada com 54% em mai/2026</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-size: 6.3px; font-family: 'IBM Plex Sans'; text-anchor: start; fill: #8a8a8a" x="7.2" y="397.8" transform="rotate(-0 7.2 397.8)">Fonte: Elaboração própria a partir das planilhas do PCM, da Deliberação CEDCA 25/2024, das Resoluções SEDEF 212, 219 e 285/2024, 029, 075 e 479/2025 e de notícias da Agência Estadual de Notícias (2024 a 2026).</text>
  </g>
 </g>
