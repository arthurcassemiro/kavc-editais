   <g id="text_1">
    <text style="font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(46.483281 32.278376)">Parâmetros: 257 unidades a distribuir, oito portes, população-alvo por porte, PCM por</text>
    <text style="font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(130.324469 40.095087)">município, tetos e cotas por faixa</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(66.681006 62.939781)">1. Cota do porte</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(21.9346 70.520221)">proporcional à população-alvo, corrigida pelo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(62.409912 78.09027)">PCM médio (eq. 6)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(242.017948 62.980797)">2. Cota do município</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(207.38326 70.520221)">parcela do município na população-alvo do</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(255.053807 78.049254)">porte (eq. 7)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #ffffff" x="182.948031" y="102.42964" transform="rotate(-0 182.948031 102.42964)">3. Ajuste pelo indicador: K = cota × (1 + PCM) − unidades da etapa prévia (eq. 8)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="91.77874" y="129.452733" transform="rotate(-0 91.77874 129.452733)">4. Parte inteira de K (eq. 9)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(203.115995 126.408177)">5. Maior resto: unidades restantes às maiores</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(249.607479 133.214789)">frações (eq. 10)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(25.441162 157.465857)">6a. Portes grandes: teto por município (10,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(75.047646 164.981218)">8, 7, 4 e 2)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(213.022635 157.424841)">6b. Portes pequenos: uma unidade aos</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(211.287401 165.020593)">municípios de maior PCM (27, 100 e 30)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(39.398594 189.354466)">Resultado: 43 + 100 + 157 = 300 unidades; a lista publicada (303 em 261 municípios)</text>
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(120.942531 197.077802)">reduziu os tetos dos portes grandes</text>
   </g>
  </g>
 </g>
