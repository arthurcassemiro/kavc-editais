   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="61.022835" y="32.111438" transform="rotate(-0 61.022835 32.111438)">Critério</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="182.948031" y="32.085803" transform="rotate(-0 182.948031 32.085803)">Deliberação e regulação</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="304.873228" y="32.09115" transform="rotate(-0 304.873228 32.09115)">Financiamento e execução</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(45.269553 57.538558)">Casa Civil</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(16.671819 64.442513)">Estudo técnico: PCM, portes</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(30.087757 71.940921)">e regra de alocação</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(148.714203 49.293665)">CEDCA/PR (conselho</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(169.138891 56.887776)">paritário)</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(141.313344 64.386185)">Aporte do FIA e aprovação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(145.011313 71.940921)">do estudo (Deliberações</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(152.591 79.51261)">60/2023 e 25/2024)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(262.136588 53.347752)">Fontes: Tesouro do Estado,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(271.805338 61.315926)">FIA/PR e Assembleia</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(261.881197 68.233553)">Legislativa (R$ 100 milhões</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(290.088463 75.735242)">em 2024)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(49.349788 113.965744)">Ipardes</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(17.248772 121.561496)">Estudo prévio (43 unidades)</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(33.392522 129.767014)">e bases de dados</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(139.186 110.188376)">SEDEF (gestora do FIA/PR)</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(138.38975 117.7278)">Resoluções 212 e 219/2024:</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(163.305922 125.617224)">critério, lista,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(149.873031 132.837272)">habilitação e repasse</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(269.661041 110.880173)">Paranacidade / SECID</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(267.907213 117.784128)">Projeto padrão, análise,</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(266.745103 125.282536)">autorização para licitar e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(292.037525 133.544382)">vistorias</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(32.245141 163.047507)">Incentivo financeiro fundo a fundo (FIA/PR para os fundos municipais), por Termo de Adesão, em</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(52.407875 170.627947)">cinco parcelas condicionadas à execução; sem convênio e sem operação de crédito</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(33.344906 197.951188)">Municípios (399): adesão, terreno, projeto de implantação, licitação, obra e prestação de contas;</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(91.512172 205.521237)">custo excedente e custeio posterior por conta do município</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(15.666565 230.305481)">Controle: TCE-PR, MP-PR, CEDCA e conselhos</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(74.146643 237.581858)">municipais</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(206.148717 230.068137)">Resultado: 303 unidades em 261 municípios</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(225.405279 237.581858)">(2024); segunda etapa em 2025</text>
   </g>
  </g>
 </g>
