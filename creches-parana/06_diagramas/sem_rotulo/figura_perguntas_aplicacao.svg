   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="73.105512" y="25.235993" transform="rotate(-0 73.105512 25.235993)">Pergunta</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="255.444094" y="25.241339" transform="rotate(-0 255.444094 25.241339)">Decisão</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(58.709574 38.068599)">1. Escala</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(20.590199 44.931538)">Como comparar a capital com um</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(25.831449 52.52729)">município de 3 mil habitantes?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(185.015344 41.15417)">Oito portes populacionais; cota de cada porte</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(208.555032 48.734609)">proporcional à população-alvo</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(52.289809 70.171286)">2. Conversão</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(14.36184 77.792741)">Como transformar um índice contínuo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(38.865121 85.306462)">em unidades inteiras?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(176.081594 73.323576)">Cota do município × (1 + PCM); parte inteira; maior</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(247.663704 81.255656)">resto</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(47.424809 101.592568)">3. Concentração</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(17.469731 109.229335)">Como evitar que poucos municípios</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(39.251762 116.743056)">recebam quase tudo?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(165.36886 105.451967)">Tetos por município nos portes grandes; uma unidade aos</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(192.415657 113.006704)">municípios de maior PCM nos pequenos</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(54.102699 133.746662)">4. Validação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(19.418246 141.357726)">Quem aprova o critério e como ele</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(58.323481 149.563244)">vira lista?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(165.57886 137.565046)">Deliberação do CEDCA; Resolução SEDEF com critério e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(173.928548 145.135094)">lista; o próximo ranqueado substitui quem não adere</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(58.128793 167.175672)">5. Limites</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(32.050512 174.079627)">O que o índice não capta?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(173.546829 166.483875)">Terreno, capacidade de licitar e fila local; margem de</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(201.357063 174.730408)">decisão delimitada e documentada</text>
   </g>
  </g>
 </g>
