   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="73.105512" y="24.679577" transform="rotate(-0 73.105512 24.679577)">Pergunta</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="255.444094" y="24.684923" transform="rotate(-0 255.444094 24.684923)">Decisão</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(48.981215 36.827188)">1. Necessidade</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(28.170434 43.731143)">O que significa um município</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(42.370043 51.244864)">precisar de creche?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(169.20136 39.953775)">Três pilares: oferta educacional, pressão demográfica e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(205.833782 48.170777)">vulnerabilidade socioeconômica</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(59.097856 67.845251)">2. Dados</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(21.744106 74.749206)">Há dado oficial e recente para os</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(47.619496 82.303943)">399 municípios?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(162.648157 67.19447)">Nove indicadores de bases públicas (Censo Escolar, Censo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(166.545188 75.206941)">2022, SIM/Sinasc, Sisvan, CadÚnico, IPDM), unidos pelo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(230.929876 82.303943)">código do IBGE</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(42.756137 98.171517)">3. Comparabilidade</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(18.825434 105.737738)">Como pôr indicadores de unidades</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(29.920434 113.972787)">distintas na mesma escala?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(163.049563 101.974588)">Normalização mínimo-máximo de 0 a 100; cobertura, oferta</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(200.777923 109.503622)">privada e renda em sentido inverso</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(50.340199 129.174267)">4. Ponderação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(17.848168 136.744316)">Quanto pesa cada indicador e cada</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(64.545824 144.299053)">pilar?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(162.650891 132.966948)">Cobertura de creche com peso 2 no pilar educacional; PCM</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(219.366751 140.523325)">= (2·FE + FD + 2·FS)/5</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(52.094574 163.969699)">5. Verificação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(26.021762 172.27256)">O ordenamento é defensável?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(175.68511 160.19233)">Correlação entre pilares, distribuição por porte e no</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(169.655266 167.747067)">mapa, comparação com o INC, sensibilidade a pesos e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(234.630032 175.301803)">normalização</text>
   </g>
  </g>
 </g>
