   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #3a3a3a" x="63.892913" y="14.788513" transform="rotate(-0 63.892913 14.788513)">Figura 4. Perguntas que estruturaram a construção do PCM</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="129.798425" y="24.679577" transform="rotate(-0 129.798425 24.679577)">Pergunta</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial, Liberation Sans'; text-anchor: middle; fill: #3a3a3a" x="312.137008" y="24.684923" transform="rotate(-0 312.137008 24.684923)">Decisão</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(105.674128 36.827188)">1. Necessidade</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(84.863347 43.731143)">O que significa um município</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(99.062956 51.244864)">precisar de creche?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(225.894273 39.953775)">Três pilares: oferta educacional, pressão demográfica e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(262.526695 48.170777)">vulnerabilidade socioeconômica</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(115.790769 67.845251)">2. Dados</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(78.437019 74.749206)">Há dado oficial e recente para os</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(104.31241 82.303943)">399 municípios?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(219.34107 67.19447)">Nove indicadores de bases públicas (Censo Escolar, Censo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(223.238102 75.206941)">2022, SIM/Sinasc, Sisvan, CadÚnico, IPDM), unidos pelo</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(287.622789 82.303943)">código do IBGE</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(99.44905 98.171517)">3. Comparabilidade</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(75.518347 105.737738)">Como pôr indicadores de unidades</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(86.613347 113.972787)">distintas na mesma escala?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(219.742477 101.974588)">Normalização mínimo-máximo de 0 a 100; cobertura, oferta</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(257.470836 109.503622)">privada e renda em sentido inverso</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(107.033113 129.174267)">4. Ponderação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(74.541081 136.744316)">Quanto pesa cada indicador e cada</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(121.238738 144.299053)">pilar?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(219.343805 132.966948)">Cobertura de creche com peso 2 no pilar educacional; PCM</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(276.059664 140.523325)">= (2·FE + FD + 2·FS)/5</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(108.787488 163.969699)">5. Verificação</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #ffffff" transform="translate(82.714675 172.27256)">O ordenamento é defensável?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(232.378023 160.19233)">Correlação entre pilares, distribuição por porte e no</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(226.34818 167.747067)">mapa, comparação com o INC, sensibilidade a pesos e</text>
    <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; fill: #3a3a3a" transform="translate(291.322945 175.301803)">normalização</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-size: 7px; font-family: 'Arial, Liberation Sans'; text-anchor: start; fill: #5f5f5f" x="7.2" y="215.655631" transform="rotate(-0 7.2 215.655631)">Fonte: Elaboração própria. Cores: pilar educacional (laranja), dados e escala (azul), ponderação (verde), indicador (roxo).</text>
  </g>
 </g>
