return w ? soma(reqs, r => r.peso * pontosNivel(nivelPessoa(p, r), r.nivelMin)) / w : 1;
}
function statusSenioridade(p, anos) {
if (!anos) return 'nao_exigida';
if (!p.temMatriz || p.anos.min == null) return 'nao_verificado';
if (p.anos.min >= anos) return 'atende';
if (p.anos.max >= anos) return 'talvez';
return 'nao';
}
function perfilNoEdital(p, ed, cfg = CONFIG) {
const impedido = p.temMatriz && ed.financiador.termos.some(t => contemTermo(p.vinculo.instituicao, t));
const restrito = !impedido && ed.financiador.tipo === 'onu' && p.vinculo.agenciaOnu;
const capEf = p.horas * (ed.exigeHorarioComercial && p.fimDeSemana ? cfg.FATOR_FDS : 1);
const statusSen = statusSenioridade(p, ed.senioridade.anos);
const finTema = !p.temMatriz ? 0
: ed.financiador.termos.some(t => contemTermo(p.textoProjetos, t)) ? 1
: ed.palavrasTema.some(t => contemTermo(p.textoProjetos, t)) ? 0.5 : 0;
return Object.assign({}, p, {
impedido, restrito, capEf, statusSen, pSen: cfg.PONTOS_SEN[statusSen],
pontosViagem: (cfg.PONTOS_VIAGEM[ed.viagem] || cfg.PONTOS_VIAGEM.nenhuma)[p.viagem],
finTema, cobInd: p.temMatriz ? coberturaIndividual(p, ed.requisitos) : 0

function montarEquipe(ed, rede, opts = {}) {
const reqs = ed.requisitos;
const D = ed.demandaSemanal;
const log = [];
const relaxados = [];
let lider;
if (opts.liderManual) {
lider = rede.find(p => p.id === opts.liderManual);
if (!lider) throw new Error('liderManual não encontrado: ' + opts.liderManual);
log.push({ id: lider.id, passo: 'lider_manual',
motivo: lider.temMatriz ? 'indicado manualmente' : 'indicado manualmente (sem matriz: não conta como cobertura)' });
} else {
let cands = rede.filter(p => p.temMatriz && !p.impedido && !p.restrito);
const filtros = [
{ nome: 'dias_uteis', f: p => !p.fimDeSemana },
{ nome: 'senioridade', f: p => p.statusSen !== 'nao' }
];
for (const fl of filtros) {
const r = cands.filter(fl.f);
if (r.length) cands = r; else relaxados.push(fl.nome);
}
lider = melhorPor(cands, p => [p.cobInd, p.pSen, p.finTema, p.socio ? 1 : 0, p.capEf, p.id]);
if (!lider) return { lider: null, membros: [], log, relaxados, capacidade: 0, demanda: D };
log.push({ id: lider.id, passo: 'lider', motivo: 'maior cobertura individual entre os elegíveis ('
+ fmt(lider.cobInd * 100) + '%)' });
}
const equipe = [lider];
const livre = p => !equipe.includes(p) && p.temMatriz && !p.impedido;
const capEquipe = () => soma(equipe, p => p.capEf);
while (equipe.length < ed.equipeMax) {
const atual = somaCobertura(reqs, equipe);
const chaveA = x => [x.g, x.p.capEf, x.p.cobInd, x.p.socio ? 1 : 0, x.p.id];
let best = melhorPor(rede.filter(p => livre(p) && !p.restrito)
.map(p => ({ p, g: somaCobertura(reqs, equipe.concat([p])) - atual })), chaveA);
let passo = 'A';
if (!best || best.g <= 1e-9) {
const elim = reqs.filter(r => r.eliminatorio);
const atualE = somaCobertura(elim, equipe);
best = melhorPor(rede.filter(p => livre(p) && p.restrito)
.map(p => ({ p, g: somaCobertura(elim, equipe.concat([p])) - atualE })), chaveA);
passo = 'A_restrito';
if (!best || best.g <= 1e-9) break;
}
equipe.push(best.p);
log.push({ id: best.p.id, passo, ganho: arred(best.g, 2),
motivo: 'aumenta a cobertura ponderada em ' + fmt(best.g) + ' ponto(s) de peso' });
}
while (equipe.length < ed.equipeMax && capEquipe() < D - 1e-9) {
const falta = D - capEquipe();
const best = melhorPor(rede.filter(p => livre(p) && !p.restrito && p.capEf > 0),
p => [Math.min(p.capEf, falta), p.cobInd, p.capEf, p.socio ? 1 : 0, p.id]);
if (!best) break;
equipe.push(best);
log.push({ id: best.id, passo: 'B', motivo: 'supre ' + fmt(Math.min(best.capEf, falta))
+ ' h/semana de ' + fmt(falta) + ' em falta' });
}
if (ed.viagem !== 'nenhuma' && equipe.length < ed.equipeMax) {
const atualV = equipe.reduce((m, p) => Math.max(m, p.temMatriz ? p.pontosViagem : 0), 0);
if (atualV < 1) {
const best = melhorPor(rede.filter(p => livre(p) && !p.restrito && p.pontosViagem > atualV),
p => [p.pontosViagem, p.cobInd, p.capEf, p.socio ? 1 : 0, p.id]);
if (best) {
equipe.push(best);
log.push({ id: best.id, passo: 'C', motivo: 'viagem: ' + best.viagem });
}
}
}
return { lider, membros: equipe, log, relaxados, capacidade: capEquipe(), demanda: D };

function calcularNota(ed, equipe, lider, opts = {}) {
const cfg = opts.config || CONFIG;
const rede = opts.rede || [];

const somaW = soma(requisitos, r => r.peso);
const fracCob = somaW ? soma(requisitos, r => r.peso * r.s) / somaW : 1;
const cobertura = cfg.PESOS.cobertura * fracCob;
const membros = equipe.filter(p => p.temMatriz);
const codigos = new Set([].concat(...membros.map(p => p.experiencia)));
const exig = ed.experienciaExigida;
const codigosAtendidos = exig.filter(c => codigos.has(c));
const fracTipo = exig.length ? codigosAtendidos.length / exig.length : 1;
const statusSen = lider ? lider.statusSen : 'nao_verificado';
const pSen = cfg.PONTOS_SEN[statusSen];
const finTema = membros.reduce((m, p) => Math.max(m, p.finTema), 0);
const experiencia = cfg.EXP.tipo * fracTipo + cfg.EXP.senioridade * pSen + cfg.EXP.financiadorTema * finTema;
const C = soma(equipe, p => p.capEf);
const D = ed.demandaSemanal;
const razaoCap = D > 0 ? C / D : Infinity;
const pViagem = ed.viagem === 'nenhuma' ? 1 : membros.reduce((m, p) => Math.max(m, p.pontosViagem), 0);
const capacidade = cfg.CAP.horas * Math.min(1, razaoCap) + cfg.CAP.viagem * pViagem;
const dias = diasEntre(opts.hoje, ed.prazo);
const E = ed.esforcoDias;
const fPrazo = dias >= 2 * E ? 1 : dias >= E ? 0.5 : 0;
const prazo = cfg.PESOS.prazo * fPrazo;
const provisoria = ed.valorEstrategico == null;
const estrategico = provisoria ? cfg.ESTRATEGICO_PADRAO : ed.valorEstrategico;
const notaAutomatica = cobertura + experiencia + capacidade + prazo;
return {
nota: Math.round(arred(notaAutomatica + estrategico, 6)),
notaAutomatica: arred(notaAutomatica, 2),
provisoria,
componentes: { cobertura: arred(cobertura, 2), experiencia: arred(experiencia, 2),
capacidade: arred(capacidade, 2), prazo, estrategico },
detalhe: {
fracCobertura: arred(fracCob, 4),
experiencia: { codigosAtendidos, codigosFaltantes: exig.filter(c => !codigos.has(c)),
fracTipo: arred(fracTipo, 4), senioridade: statusSen, financiadorTema: finTema },
capacidade: { horasEquipe: C, demandaSemanal: arred(D, 2), razao: arred(razaoCap, 4), viagem: pViagem },
prazo: { diasAtePrazo: dias, esforcoDias: E }
},
requisitos

}
function idiomaVerificado(idioma, pessoas, confirmados = {}) {

}

- peso: pontos ou percentual que o edital dá. Em requisitos, só quando o requisito corresponde sozinho a uma linha da grade; nunca reparta um peso. anos_minimos: anos exigidos, se houver.
- experiencia_com (mesmos códigos da matriz de habilidades): multilaterais (BID, PNUD, Banco Mundial, CAF, UNOPS, ONU, cooperação bilateral); governos_subnacionais (estados, municípios, secretarias estaduais e municipais); bancos_publicos_fundos (BNDES, Caixa, bancos de fomento, fundos de desenvolvimento; "multilateral development banks" é multilaterais); universidades_think_tanks (universidades, centros de pesquisa, think tanks como o WRI); consultorias_tecnicas (trabalho prévio em consultoria técnica); eois_pesquisa_aplicada (EOIs, estudos e pesquisa aplicada). A matriz não mede três casos; use estes códigos em vez de forçar um parecido: governo_federal (ministérios, órgãos federais, governo nacional), ongs_fundacoes (ONGs e fundações não acadêmicas, como a Oxfam), setor_privado (empresas).
- perfis_exigidos: um item por papel da equipe; em contratação individual, um item para o(a) consultor(a). chave = true para líder, coordenador(a), key expert ou profissional-chave.
- experiencia_exigida.tipo: institucional (com um tipo de cliente ou financiador), tematica (em um tema), geografica (região ou país), metodologica (um método). sujeito: firma quando o edital cobra da empresa; profissional quando cobra de uma pessoa ou perfil.
- documentos_exigidos: o que precisa ser enviado ou apresentado; cadastro_portal com o nome do portal quando o envio exige cadastro (Quantum, UNGM, BEO (BID), SAM, SICAF).
- criterios_avaliacao: só as linhas de nível mais baixo que têm peso; não repita subtotais. Nota de corte entra com tipo "habilitacao" e peso = nota mínima. Preço ou proposta financeira = "financeiro".

ESFORÇO (esforco_estimado_horas: horas de trabalho do contrato, não da proposta; inferido = true)
Horas totais declaradas: use-as. Dias de trabalho (working days, person-days, dias de trabalho, días hábiles de trabajo): dias × 8. Meses-pessoa: meses × 176. Duração em meses com dedicação declarada (tempo integral = 100%, meio período = 50%, "X%"): meses × 176 × dedicação; com "N horas por semana": meses × 4,33 × N. Só a duração: valor null, faixa [meses × 44, meses × 176] e base explicando. Nada disso: valor, faixa e base null. Escreva a conta em base (ex.: "180 dias-pessoa × 8 h").

RISCOS (só os que o texto sustenta; origem "texto"; até 8; não crie prazo_curto nem fora_da_matriz, que a página calcula)
servidor_publico (restrição a servidores ou funcionários públicos: alta em contratação individual, media em firma); residencia_presencial (morar ou trabalhar presencialmente em local definido: alta se for rotina semanal ou mudança, media se pontual); dedicacao_exclusiva; conflito_interesse (só vedação concreta, não a cláusula padrão); viagem; idioma (proposta ou trabalho em idioma que não o português); cadastro_portal; elegibilidade (nacionalidade, país-membro, firma × individual); formacao_exigida (doutorado ou título obrigatório: alta); garantia_financeira; pagamento_por_produto; propriedade_intelectual; outro. Severidade: alta se pode impedir a participação, media se exige preparo, baixa se é só atenção.

TAMANHO: até 20 requisitos (junte os muito parecidos), 10 perfis, 12 experiências, 15 documentos, 12 critérios, 8 riscos.

'Presentes: ' + presentes.map(nomeDe).join(', ') + ' · Secretário(a): ' + nomeDe(secretario), '', '## Decisões', ''];
itens.forEach((i, k) => {
const r = resultados[i.id] || { tipo: 'sem_registro' };
const d = r.decisao_id ? decisoesPorId[r.decisao_id] : null;
L.push((k + 1) + '. **' + i.pergunta + '**');
if (r.tipo === 'decidido' && d) L.push('   - Decisão: ' + d.decisao + (d.dono ? ' · Dono: ' + nomeDe(d.dono) : '') + (d.data ? ' · Até: ' + ddmm(d.data) : ''));
else if (r.tipo === 'adiado') L.push('   - Adiado' + (r.adiamentos >= 2 ? ' pela 2ª vez: frente marcada como parada' : ''));
else if (r.tipo === 'assincrono') L.push('   - Virou voto assíncrono de 48 h');
else L.push('   - Sem registro');
});
return L.join('\n') + '\n';
}
function resumoWhatsApp(reuniao, itens, resultados, decisoesPorId) {
const linhas = ['*KAVC — reunião de ' + ddmm(reuniao.data) + '*'];

const r = resultados[i.id]; const d = r && r.decisao_id ? decisoesPorId[r.decisao_id] : null;

});
return linhas.join('\n');
}
